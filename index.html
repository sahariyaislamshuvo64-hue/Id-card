        .shop-list {

            display: flex;
            justify-content: space-between;

        .shop-item:hover {

            font-weight: bold;

        .modal {

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
            position: relative;
        }
        .close-btn {

            top: 10px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #888;
        }
        .close-btn:hover {
            color: black;
        }
        .detail-item {

const floors = ["Underground/Basement", "Ground Floor", "1st Floor", "2nd Floor", "3rd Floor", "4th Floor"];

function renderButtons() {
    const btnContainer = document.getElementById("buttons");
    floors.forEach(floor => {
        const count = shops.filter(s => s.floor === floor).length;
        const btn = document.createElement("button");
        btn.className = "floor-btn";
        btn.innerText = `${floor} (${count})`;
        btn.onclick = () => showShops(floor);
        btnContainer.appendChild(btn);
    });
}

function showShops(floorName) {
    const shopList = document.getElementById("shopList");
    const filteredShops = shops.filter(s => s.floor === floorName);
    
    let html = `<h3>${floorName} - মোট দোকান (${filteredShops.length} টি)</h3>`;
    filteredShops.forEach(shop => {
        html += `
            <div class="shop-item" onclick="openModal('${shop.sl}')">
                <span><strong>SL: ${shop.sl}</strong> — ${shop.name}</span>
                <span style="color:#007bff;">বিস্তারিত দেখুন &rarr;</span>
            </div>
        `;
    });
    
    shopList.innerHTML = html;
}

function openModal(slNumber) {
    const shop = shops.find(s => s.sl === slNumber);
    if(shop) {
        document.getElementById("modalShopName").innerText = shop.name;
        document.getElementById("modalSL").innerText = shop.sl;
        document.getElementById("modalFloor").innerText = shop.floor;
        document.getElementById("modalWallet").innerText = shop.wallet;
        document.getElementById("modalAddress").innerText = shop.address;
        document.getElementById("modalCategory").innerText = shop.category;
        
        document.getElementById("shopModal").style.display = "flex";
    }
}

function closeModal() {
    document.getElementById("shopModal").style.display = "none";
}

// Close modal when clicking outside of it
window.onclick = function(event) {
    const modal = document.getElementById("shopModal");
    if (event.target == modal) {
        modal.style.display = "none";
    }
}

// Initial Call
renderButtons();
