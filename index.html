<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Premium ID Card Generator - Insight Metrics</title>
  <!-- html2pdf.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    body { background: #cfd8dc; padding: 20px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }

    /* FORM SIDEBAR */
    .form-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      width: 350px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      max-height: 90vh;
      overflow-y: auto;
    }
    .form-container h2 { font-size: 16px; margin-bottom: 15px; color: #00796b; border-bottom: 2px solid #00a651; padding-bottom: 5px; }
    
    .select-card-qty {
      background: #e8f5e9;
      border: 1.5px solid #00a651;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .select-card-qty label { font-size: 13px; font-weight: bold; color: #00695c; display: block; margin-bottom: 6px; }
    .select-card-qty select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #b2dfdb; font-weight: bold; outline: none; }

    .member-block {
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .member-block h3 { font-size: 13px; color: #008d44; margin-bottom: 8px; border-bottom: 1px dashed #cccccc; padding-bottom: 4px; }
    
    .input-group { margin-bottom: 8px; }
    .input-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #444; }
    .input-group input { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }

    .btn-download {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00a651 0%, #00695c 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(0,166,81,0.3);
      transition: all 0.2s ease;
    }
    .btn-download:hover { opacity: 0.95; transform: translateY(-1px); }

    /* PREVIEW AREA */
    .preview-container {
      background: #424242;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* EXACT A4 PAGE SETUP (2 SETS PER PAGE FOR PERFECT PDF FIT) */
    .pdf-page {
      width: 210mm;
      height: 290mm;
      background: #ffffff !important;
      padding: 10mm;
      display: flex;
      flex-direction: column;
      gap: 12mm;
      page-break-after: always;
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .card-pair-wrapper {
      display: flex;
      justify-content: center;
      gap: 12mm;
      height: 122mm;
      align-items: center;
    }

    /* UNIQUE & MODERN ID CARD STYLING */
    .id-card {
      width: 66mm;
      height: 112mm;
      background: #ffffff !important;
      position: relative;
      overflow: hidden;
      border: 1.5px solid #00a651;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* FRONT HEADER WITH GRADIENT COLOR */
    .front-header {
      background: linear-gradient(135deg, #00a651 0%, #00796b 100%) !important;
      padding: 10px 8px 6px 8px;
      text-align: center;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .header-im-logo {
      display: inline-flex;
      align-items: flex-end;
      height: 24px;
      margin-bottom: 2px;
    }
    .header-im-logo .dot-i-stem {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-right: 2px;
    }
    .header-im-logo .i-dot {
      width: 6px;
      height: 6px;
      background: #ffffff !important;
      border-radius: 50%;
      margin-bottom: 2px;
    }
    .header-im-logo .i-stem {
      width: 6px;
      height: 14px;
      background: #ffffff !important;
      border-radius: 1px;
    }
    .header-im-logo .m-text {
      font-size: 26px;
      font-weight: 900;
      color: #e0f2f1;
      line-height: 0.72;
    }

    .company-title {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }
    .company-title .light-green { color: #80ff80; }
    .company-title .white-txt { color: #ffffff; }

    .pill-badge {
      background: #ffffff !important;
      color: #00796b;
      font-size: 7.5px;
      font-weight: 900;
      padding: 2.5px 12px;
      border-radius: 10px;
      display: inline-block;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    .photo-container {
      width: 90px;
      height: 100px;
      border: 3px solid #00a651;
      border-radius: 12px;
      margin: 6px auto 0 auto;
      overflow: hidden;
      background: #f4f4f4;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .photo-container img { width: 100%; height: 100%; object-fit: cover; }

    .user-name {
      text-align: center;
      font-size: 11.5px;
      font-weight: 900;
      color: #00796b;
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* LARGE BOLD INFORMATION TEXT */
    .info-section {
      margin: 6px 10px 8px 12px;
      position: relative;
      padding-left: 8px;
    }
    .info-section::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #00a651 !important;
      border-radius: 2px;
    }
    .info-row { display: flex; font-size: 9.5px; font-weight: 900; color: #000; margin-bottom: 4px; }
    .info-label { width: 70px; color: #111; font-weight: 900; }
    .info-val { color: #000; font-weight: 900; font-size: 10px; }

    .bottom-bar { height: 5px; background: #00a651 !important; width: 100%; }

    /* BACK SIDE STYLING */
    .back-header {
      background: linear-gradient(135deg, #00a651 0%, #00796b 100%) !important;
      padding: 6px 8px;
      margin: 6px 8px 4px 8px;
      border-radius: 4px;
      text-align: center;
    }

    .office-location-title {
      text-align: center;
      font-size: 8px;
      font-weight: 900;
      color: #00a651;
      margin-top: 2px;
    }

    .address-card {
      border: 1px solid #d0d0d0;
      border-radius: 5px;
      padding: 5px;
      margin: 2px 10px 0 10px;
      text-align: center;
      font-size: 6.8px;
      color: #222;
      line-height: 1.35;
      font-weight: 700;
      background: #fafafa;
    }

    .client-title {
      text-align: center;
      font-size: 7.5px;
      font-weight: 900;
      color: #00a651;
      margin-top: 6px;
    }

    .client-logos {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
      margin-top: 4px;
    }
    .client-logos .gp { color: #00a3e0; font-size: 8px; font-weight: 900; }
    .client-logos .jti { color: #00a651; font-size: 10px; font-weight: 900; font-style: italic; }
    .akg-emblem {
      width: 20px;
      height: 20px;
      background: #e30613 !important;
      border: 1px solid #fecb00;
      border-radius: 50%;
      color: #fff;
      font-size: 5.5px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .client-logos .smc { border: 1px solid #1a237e; padding: 1px 3px; font-size: 6.5px; color: #1a237e; font-weight: 800; }

    .back-watermark-container {
      text-align: center;
      margin-top: 3px;
    }
    .back-im-logo {
      display: inline-flex;
      align-items: flex-end;
    }
    .back-im-logo .dot-i-stem {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-right: 2px;
    }
    .back-im-logo .i-dot {
      width: 17px;
      height: 16px;
      background: #00a651 !important;
      border-radius: 50%;
      margin-bottom: 3px;
    }
    .back-im-logo .i-stem {
      width: 17px;
      height: 38px;
      background: #00a651 !important;
      border-radius: 1.5px;
    }
    .back-im-logo .m-text {
      font-size: 68px;
      font-weight: 900;
      color: #cfd8dc;
      line-height: 0.72;
    }

    .validity-row {
      text-align: center;
      font-size: 7.5px;
      font-weight: 800;
      color: #111;
      margin-top: 2px;
    }

    /* REAL NATURAL SIGNATURE */
    .signature-area {
      text-align: right;
      padding-right: 12px;
      margin-top: -10px;
      margin-bottom: 5px;
    }
    .sig-img { width: 75px; height: 28px; object-fit: contain; display: block; margin-left: auto; margin-bottom: -3px; }
    .sig-text { font-size: 7px; font-weight: 900; color: #111; border-top: 1px solid #111; display: inline-block; padding-top: 1px; }
  </style>
</head>
<body>

  <!-- INPUT CONTROLS -->
  <div class="form-container">
    <h2>Bulk ID Card Generator</h2>
    
    <div class="select-card-qty">
      <label for="cardCount">কয়টি ID কার্ড লাগবে?</label>
      <select id="cardCount" onchange="renderForms()">
        <option value="1">1 Person</option>
        <option value="2">2 Persons (1 Page)</option>
        <option value="3">3 Persons</option>
        <option value="4">4 Persons (2 Pages)</option>
        <option value="5">5 Persons</option>
        <option value="6">6 Persons (3 Pages)</option>
        <option value="7">7 Persons</option>
        <option value="8">8 Persons (4 Pages)</option>
        <option value="9">9 Persons</option>
        <option value="10" selected>10 Persons (5 Pages)</option>
      </select>
    </div>

    <div id="formsWrapper"></div>

    <button class="btn-download" onclick="downloadAllPDF()">Download All Cards (PDF)</button>
  </div>

  <!-- PDF AREA -->
  <div class="preview-container" id="pdfArea">
    <!-- Dynamic Content Rendered Here -->
  </div>

  <script>
    function renderForms() {
      const count = parseInt(document.getElementById('cardCount').value);
      const formsWrapper = document.getElementById('formsWrapper');
      const pdfArea = document.getElementById('pdfArea');

      formsWrapper.innerHTML = '';
      pdfArea.innerHTML = '';

      let pageDiv = null;

      for (let i = 1; i <= count; i++) {
        // Form Inputs
        formsWrapper.innerHTML += `
          <div class="member-block">
            <h3>Card #${i} Information</h3>
            <div class="input-group">
              <label>Full Name</label>
              <input type="text" id="name_${i}" value="Md Tamim" oninput="updateCards()">
            </div>
            <div class="input-group">
              <label>ID No.</label>
              <input type="text" id="id_${i}" value="${5160 + i - 1}" oninput="updateCards()">
            </div>
            <div class="input-group">
              <label>Mobile</label>
              <input type="text" id="mobile_${i}" value="01608-038005" oninput="updateCards()">
            </div>
            <div class="input-group">
              <label>Blood Group</label>
              <input type="text" id="blood_${i}" value="O+" oninput="updateCards()">
            </div>
            <div class="input-group">
              <label>Profile Photo</label>
              <input type="file" accept="image/*" onchange="loadPhoto(event, ${i})">
            </div>
          </div>
        `;

        // Create a new A4 Page every 2 cards
        if ((i - 1) % 2 === 0) {
          pageDiv = document.createElement('div');
          pageDiv.className = 'pdf-page';
          pdfArea.appendChild(pageDiv);
        }

        // Render ID Cards
        const pairHTML = `
          <div class="card-pair-wrapper">
            <!-- FRONT SIDE -->
            <div class="id-card">
              <div>
                <div class="front-header">
                  <div class="header-im-logo">
                    <div class="dot-i-stem">
                      <div class="i-dot"></div>
                      <div class="i-stem"></div>
                    </div>
                    <div class="m-text">m</div>
                  </div>
                  <div class="company-title">
                    <span class="light-green">Insight</span> <span class="white-txt">Metrics Limited</span>
                  </div>
                  <div class="pill-badge">IDENTITY CARD</div>
                </div>

                <div class="photo-container">
                  <img id="photo_preview_${i}" src="https://via.placeholder.com/105x115?text=Photo" alt="User Photo">
                </div>

                <div class="user-name" id="view_name_${i}">Md Tamim</div>

                <div class="info-section">
                  <div class="info-row"><span class="info-label">ID NO.</span><span class="info-val" id="view_id_${i}">:${5160 + i - 1}</span></div>
                  <div class="info-row"><span class="info-label">MOBILE</span><span class="info-val" id="view_mobile_${i}">: 01608-038005</span></div>
                  <div class="info-row"><span class="info-label">BLOOD GROUP</span><span class="info-val" id="view_blood_${i}">:O+</span></div>
                </div>
              </div>
              <div class="bottom-bar"></div>
            </div>

            <!-- BACK SIDE -->
            <div class="id-card">
              <div>
                <div class="back-header">
                  <div class="company-title">
                    <span class="light-green">Insight</span> <span class="white-txt">Metrics Limited</span>
                  </div>
                </div>

                <div class="office-location-title">OFFICE LOCATION</div>
                <div class="address-card">
                  House #10, Suite #203, Level #1, Road #8<br>
                  Gulshan #1, Dhaka 1212, Bangladesh<br>
                  <b>Call:</b> 01311930805 |<br>
                  www.insightmetricsbd.com
                </div>

                <div class="client-title">ASSOCIATED CLIENT COMPANIES</div>
                <div class="client-logos">
                  <span class="gp">grameenphone</span>
                  <span class="jti">JTi</span>
                  <div class="akg-emblem">AKG</div>
                  <span class="smc">SMC</span>
                </div>

                <div class="back-watermark-container">
                  <div class="back-im-logo">
                    <div class="dot-i-stem">
                      <div class="i-dot"></div>
                      <div class="i-stem"></div>
                    </div>
                    <div class="m-text">m</div>
                  </div>
                </div>
              </div>

              <div>
                <div class="validity-row">
                  Issue Date: 01-02-2024 | Expire Date: 12-31-2028
                </div>

                <div class="signature-area">
                  <svg class="sig-img" viewBox="0 0 140 50">
                    <path d="M 10 38 Q 32 15 50 6 C 52 25 55 35 58 42 C 60 40 68 28 72 26 C 75 32 76 38 78 35 C 85 24 92 28 95 32 C 102 26 110 28 118 26" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <div class="sig-text">Issuing Authority</div>
                </div>
                <div class="bottom-bar"></div>
              </div>
            </div>
          </div>
        `;

        pageDiv.innerHTML += pairHTML;
      }
    }

    function updateCards() {
      const count = parseInt(document.getElementById('cardCount').value);
      for (let i = 1; i <= count; i++) {
        document.getElementById(`view_name_${i}`).innerText = document.getElementById(`name_${i}`).value;
        document.getElementById(`view_id_${i}`).innerText = ":" + document.getElementById(`id_${i}`).value;
        document.getElementById(`view_mobile_${i}`).innerText = ": " + document.getElementById(`mobile_${i}`).value;
        document.getElementById(`view_blood_${i}`).innerText = ":" + document.getElementById(`blood_${i}`).value;
      }
    }

    function loadPhoto(event, idIndex) {
      const reader = new FileReader();
      reader.onload = function() {
        document.getElementById(`photo_preview_${idIndex}`).src = reader.result;
      }
      if(event.target.files[0]){
        reader.readAsDataURL(event.target.files[0]);
      }
    }

    function downloadAllPDF() {
      const element = document.getElementById('pdfArea');
      const opt = {
        margin:       0,
        filename:     'Insight_Metrics_10_ID_Cards.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:    { mode: ['css', 'legacy'] }
      };

      html2pdf().set(opt).from(element).save();
    }

    window.onload = renderForms;
  </script>
</body>
</html>
