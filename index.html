<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মার্চেন্ট ও দোকান ডাটাবেজ</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f7f6; color: #333; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { margin-bottom: 20px; color: #1e293b; text-align: center; }
    
    .upload-section { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #0284c7; padding: 25px; border-radius: 8px; background: #f0f9ff; margin-bottom: 25px; }
    .upload-section input { display: none; }
    .upload-btn { background: #0284c7; color: #fff; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .upload-btn:hover { background: #0369a1; }
    
    .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .controls select, .controls input { flex: 1; min-width: 200px; padding: 10px 15px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    
    .stats { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px 20px; border-radius: 6px; font-weight: 600; color: #475569; }
    .stat-card span { color: #0284c7; font-weight: bold; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 12px 15px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { background-color: #f1f5f9; color: #334155; font-weight: bold; }
    tr:hover { background-color: #f8fafc; }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-floor { background: #e0f2fe; color: #0369a1; }
    .badge-cat { background: #fef3c7; color: #b45309; }
  </style>
</head>
<body>

<div class="container">
  <h2>মার্চেন্ট ও দোকান ডাটাবেজ ড্যাশবোর্ড</h2>
  
  <!-- ফাইল আপলোড অংশ -->
  <div class="upload-section">
    <label for="excelFile" class="upload-btn">📁 যেকোনো Excel (.xlsx/.xls) আপলোড করুন</label>
    <input type="file" id="excelFile" accept=".xlsx, .xls">
    <p id="fileName" style="margin-top: 10px; font-size: 13px; color: #64748b;"></p>
  </div>

  <!-- ফিল্টার ও সার্চ বারের সুবিধা -->
  <div class="controls">
    <select id="floorFilter">
      <option value="all">সব ফ্লোর (All Floors)</option>
      <option value="Basement">Basement / Underground</option>
      <option value="Ground Floor">Ground Floor / Nich Tola</option>
      <option value="1st Floor">1st Floor</option>
      <option value="2nd Floor">2nd Floor</option>
      <option value="3rd Floor">3rd Floor</option>
    </select>
    <input type="text" id="searchInput" placeholder="দোকানের নাম, ওয়ালেট বা ঠিকানা দিয়ে সার্চ করুন...">
  </div>

  <!-- সামারি/পরিসংখ্যান -->
  <div class="stats">
    <div class="stat-card">মোট দোকান: <span id="totalStores">0</span> টি</div>
    <div class="stat-card">বর্তমান ফ্লোরে দোকান: <span id="filteredStores">0</span> টি</div>
  </div>

  <!-- টেবিল প্রদর্শন -->
  <div style="overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th>SL</th>
          <th>ফ্লোর</th>
          <th>দোকান / মার্চেন্টের নাম</th>
          <th>ওয়ালেট নম্বর</th>
          <th>ঠিকানা</th>
          <th>ক্যাটাগরি</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="6" style="text-align: center; color: #94a3b8;">অনুগ্রহ করে একটি এক্সেল ফাইল আপলোড করুন।</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  let storeData = [];

  // এক্সেল ফাইল রিড করার ইভেন্ট
  document.getElementById('excelFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById('fileName').textContent = "লোড করা হয়েছে: " + file.name;

    const reader = new FileReader();
    reader.onload = function(e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      
      // প্রথম শিটের ডাটা রূপান্তর
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      const rawJson = XLSX.utils.sheet_to_json(worksheet);

      // ডাটা প্রসেস এবং অটো-ফ্লোর ডিটেকশন
      storeData = rawJson.map(row => {
        const address = strVal(row['Present Address'] || row['Address'] || row['Present_Address']);
        
        return {
          sl: strVal(row['SL'] || row['sl']),
          floor: detectFloor(address, strVal(row['Floor'] || row['floor'])),
          name: strVal(row['Merchant Name'] || row['Merchant_Name'] || row['Name'] || row['name']),
          wallet: strVal(row['Wallet No'] || row['Wallet'] || row['wallet']),
          address: address,
          category: strVal(row['Category'] || row['category'])
        };
      });

      renderTable(storeData);
    };
    reader.readAsArrayBuffer(file);
  });

  // স্ট্রিং কনভার্ট সহায়তা
  function strVal(val) {
    return val ? String(val).trim() : '';
  }

  // ঠিকানার কিওয়ার্ড দেখে ফ্লোর ডিটেক্ট করার লজিক
  function detectFloor(address, explicitFloor) {
    if (explicitFloor) return explicitFloor;
    const addr = address.toLowerCase();
    if (addr.includes('2nd') || addr.includes('2rd')) return '2nd Floor';
    if (addr.includes('3rd') || addr.includes('level. 3')) return '3rd Floor';
    if (addr.includes('1st')) return '1st Floor';
    if (addr.includes('besment') || addr.includes('underground') || addr.includes('basement') || addr.includes('ander ground')) return 'Basement';
    return 'Ground Floor';
  }

  // ফিল্টার ও সার্চ সিস্টেম
  document.getElementById('floorFilter').addEventListener('change', filterData);
  document.getElementById('searchInput').addEventListener('input', filterData);

  function filterData() {
    const selectedFloor = document.getElementById('floorFilter').value;
    const searchText = document.getElementById('searchInput').value.toLowerCase();

    const filtered = storeData.filter(item => {
      const matchesFloor = selectedFloor === 'all' || item.floor === selectedFloor;
      const matchesSearch = item.name.toLowerCase().includes(searchText) || 
                            item.wallet.toLowerCase().includes(searchText) || 
                            item.address.toLowerCase().includes(searchText);
      return matchesFloor && matchesSearch;
    });

    renderTable(filtered);
  }

  // টেবিল রেন্ডারিং
  function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    document.getElementById('totalStores').textContent = storeData.length;
    document.getElementById('filteredStores').textContent = data.length;

    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #94a3b8;">কোনো ডাটা পাওয়া যায়নি।</td></tr>`;
      return;
    }

    data.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.sl || '-'}</td>
        <td><span class="badge badge-floor">${item.floor}</span></td>
        <td><strong>${item.name || 'নাম নেই'}</strong></td>
        <td>${item.wallet || '-'}</td>
        <td>${item.address || '-'}</td>
        <td><span class="badge badge-cat">${item.category || 'N/A'}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }
</script>

</body>
</html>
